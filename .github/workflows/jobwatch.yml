name: JobWatch Daily Search

on:
  schedule:
    - cron: '0 */8 * * *'  # Runs every 8 hours (e.g., 00:00, 08:00, 16:00 UTC)
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx

      - name: Run Junior/Mid Tracker
        env:
          JOBSPIPE_KEY: ${{ secrets.JOBSPIPE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_JUNIOR }}
        run: python main.py

      - name: Run Senior Tracker
        env:
          JOBSPIPE_KEY: ${{ secrets.JOBSPIPE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_SENIOR }}
        run: python senior_jobs.py
