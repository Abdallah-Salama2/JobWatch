name: Run JobWatch Daily

on:
  schedule:
    # Runs daily at 7:00 AM Cairo time (4:00 AM UTC)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger for testing

jobs:
  run-jobwatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore SQLite database cache
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Install dependencies
        run: pip install httpx python-dotenv

      - name: Run script
        env:
          JOBSPIPE_KEY: ${{ secrets.JOBSPIPE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
